name: Chai OClock Render Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render-worker.mjs"
      - "src/lib/canva-api.mjs"
      - ".github/workflows/render-worker.yml"
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: chai-oclock-render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jrdtelveihwusdtpgnks.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
      CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
      CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Render next approved package
        run: npm run render:one
