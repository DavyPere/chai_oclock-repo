name: Chai OClock Render Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: chai-oclock-render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jrdtelveihwusdtpgnks.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
      CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
      CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Canva configuration
        id: canva
        shell: bash
        run: |
          if [ -n "$CANVA_ACCESS_TOKEN" ] || { [ -n "$CANVA_CLIENT_ID" ] && [ -n "$CANVA_CLIENT_SECRET" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Canva OAuth is not configured yet; render worker skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.canva.outputs.configured == 'true'
        with:
          node-version: "22"

      - run: npm install
        if: steps.canva.outputs.configured == 'true'

      - name: Render next approved package
        if: steps.canva.outputs.configured == 'true'
        run: npm run render:one
