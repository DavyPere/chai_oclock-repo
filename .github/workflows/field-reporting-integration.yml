name: Field Reporting Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test-field-report.mjs"
      - "docs/field-reports.html"
      - "supabase/functions/review-dashboard-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/field-reporting-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jrdtelveihwusdtpgnks.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Verify field reporting workflow
        run: npm run test:field-report
