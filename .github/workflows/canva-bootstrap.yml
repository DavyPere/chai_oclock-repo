name: Bootstrap Canva OAuth Token

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jrdtelveihwusdtpgnks.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CANVA_REFRESH_TOKEN_BOOTSTRAP: ${{ secrets.CANVA_REFRESH_TOKEN_BOOTSTRAP }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Store Canva refresh token in Supabase Vault
        run: npm run canva:bootstrap-token
