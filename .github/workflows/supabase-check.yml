name: Supabase Connection Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/supabase.js"
      - "scripts/check-supabase.mjs"
      - "package.json"
      - ".github/workflows/supabase-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jrdtelveihwusdtpgnks.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Verify Supabase API
        run: npm run check:supabase
